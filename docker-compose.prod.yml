services:
  pal-mcp-server:
    build:
      context: .
      dockerfile: Dockerfile.minimal
    image: pal-mcp-server:minimal
    container_name: pal-mcp-server
    user: "1000:1000"
    dns:
      - 8.8.8.8
      - 8.8.4.4
    
    # 起動時に pip install を実行してからモニターを起動 (gemini-cli は /app/packages からインストール)
    command: >
      sh -c "npm install -g /app/packages/gemini-core.tgz /app/packages/gemini-cli.tgz @anthropic-ai/claude-code @openai/codex && 
             python3 -m pip install -r requirements.txt -r requirements-monitor.txt &&
             python3 monitor/run_coordinator.py --dual"
    
    ports:
      - "9876:9876"
    
    env_file:
      - .env
    
    environment:
      - TZ=${TZ:-Asia/Tokyo}
      - MONITOR_ENABLED=true
      - MONITOR_COORDINATOR_URL=http://localhost:9876
      - HTTP_PROXY
      - HTTPS_PROXY
      - NO_PROXY=localhost,127.0.0.1,pal-mcp-server
      # Ensure PATH includes the new /app based installation directories defined in Dockerfile
      - PATH=/usr/local/bin:/usr/local/sbin:/usr/bin:/usr/sbin:/bin:/sbin:/app/.npm-global/bin:/app/.pylibs/bin:/home/paluser/.local/bin
      - NPM_CONFIG_PREFIX=/app/.npm-global
      - PYTHONUSERBASE=/app/.pylibs
      
    volumes:
      - ./logs:/app/logs
      # ホストのホームディレクトリをマウント。書き込み権限が必要
      - ${HOME}:/home/paluser
      - ${HOME}:/home/${USER}
    
    restart: unless-stopped

networks:
  default:
    driver: bridge
