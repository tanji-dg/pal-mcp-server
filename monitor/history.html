<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PAL MCP History</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: #eee;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .header {
            background: #16213e;
            padding: 15px 20px;
            border-bottom: 1px solid #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }
        h1 {
            font-size: 20px;
            color: #00d4ff;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .nav-link {
            color: #888;
            text-decoration: none;
            font-size: 14px;
            padding: 5px 10px;
            border-radius: 4px;
            transition: all 0.2s;
        }
        .nav-link:hover {
            background: #0f1525;
            color: #eee;
        }
        .container {
            display: flex;
            flex-grow: 1;
            overflow: hidden;
        }
        .sidebar {
            width: 300px;
            background: #16213e;
            border-right: 1px solid #333;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }
        .search-box {
            padding: 15px;
            border-bottom: 1px solid #1a2639;
        }
        .search-box input {
            width: 100%;
            background: #0f1525;
            border: 1px solid #333;
            padding: 8px;
            border-radius: 4px;
            color: #eee;
        }
        .conversation-list {
            flex-grow: 1;
            overflow-y: auto;
            padding: 10px;
        }
        .conversation-item {
            padding: 10px;
            border-radius: 4px;
            cursor: pointer;
            margin-bottom: 5px;
            border: 1px solid transparent;
        }
        .conversation-item:hover {
            background: #1f2a48;
        }
        .conversation-item.active {
            background: #1f2a48;
            border-color: #00d4ff;
        }
        .conv-id {
            font-family: monospace;
            color: #00d4ff;
            font-size: 12px;
            margin-bottom: 4px;
        }
        .conv-meta {
            font-size: 11px;
            color: #888;
            display: flex;
            justify-content: space-between;
        }
        .main-view {
            flex-grow: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .message {
            background: #16213e;
            padding: 15px;
            border-radius: 8px;
            max-width: 90%;
        }
        .message.user {
            align-self: flex-end;
            background: #1f2a48;
            border-bottom-right-radius: 2px;
        }
        .message.assistant {
            align-self: flex-start;
            border-bottom-left-radius: 2px;
        }
        .message-header {
            font-size: 11px;
            color: #888;
            margin-bottom: 8px;
            font-weight: bold;
            text-transform: uppercase;
        }
        .message-content {
            white-space: pre-wrap;
            line-height: 1.5;
            font-size: 14px;
        }
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #666;
        }
        .refresh-btn {
            background: #00d4ff;
            color: #000;
            border: none;
            padding: 5px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        .refresh-btn:hover {
            background: #00b8e6;
        }
        .raw-view {
            font-family: monospace;
            background: #0f1525;
            padding: 15px;
            border-radius: 4px;
            overflow-x: auto;
            white-space: pre;
            color: #a5b1c2;
            font-size: 12px;
        }
        /* Terminal Styling for Chat View */
        .terminal-block {
            background: #0f1525;
            border-radius: 4px;
            margin: 5px 0;
            overflow: hidden;
            border: 1px solid #333;
            font-family: 'Consolas', 'Monaco', monospace;
        }
        .term-header {
            background: #1a2639;
            padding: 2px 8px;
            font-size: 9px;
            color: #888;
            border-bottom: 1px solid #222;
            display: flex;
            align-items: center;
        }
        .term-header::before {
            content: ">";
            color: #00d4ff;
            margin-right: 6px;
            font-weight: bold;
        }
        .term-body {
            padding: 8px;
            font-size: 13px;
            color: #eee;
            white-space: pre-wrap;
            line-height: 1.3;
        }
        .term-prompt {
            color: #ffa502;
            margin-right: 6px;
            font-weight: bold;
        }
        /* Summary Block */
        .summary-block {
            margin-top: 15px;
            padding: 10px;
            background: #2ed57311;
            border: 1px solid #2ed57333;
            border-radius: 4px;
            font-size: 13px;
        }
        .summary-header {
            color: #2ed573;
            font-weight: bold;
            font-size: 11px;
            text-transform: uppercase;
            margin-bottom: 5px;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .summary-header::before {
            content: "📝";
        }
        /* Thinking Block */
        .thinking-block {
            margin-bottom: 15px;
            padding: 10px;
            background: #2f364011;
            border: 1px solid #2f364044;
            border-left: 3px solid #7f8fa6;
            border-radius: 4px;
            font-size: 13px;
            color: #bdc3c7;
            font-style: italic;
        }
        .thinking-header {
            color: #7f8fa6;
            font-weight: bold;
            font-size: 10px;
            text-transform: uppercase;
            margin-bottom: 5px;
            display: flex;
            align-items: center;
            gap: 5px;
            font-style: normal;
        }
        .thinking-header::before {
            content: "💭";
        }
        /* Tab for view mode */
        .view-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #333;
        }
        .tab-btn {
            background: transparent;
            border: 1px solid #333;
            color: #888;
            padding: 5px 15px;
            border-radius: 15px;
            cursor: pointer;
            font-size: 12px;
        }
        .tab-btn.active {
            background: #00d4ff22;
            color: #00d4ff;
            border-color: #00d4ff;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>📜 Conversation History</h1>
        <div>
            <button class="refresh-btn" onclick="loadHistory()">Refresh</button>
            <a href="/" class="nav-link" style="margin-left: 10px;">Back to Dashboard</a>
        </div>
    </div>

    <div class="container">
        <div class="sidebar">
            <div class="search-box">
                <input type="text" placeholder="Search ID..." oninput="filterList(this.value)">
            </div>
            <div class="conversation-list" id="convList">
                <!-- Items will be injected here -->
            </div>
        </div>
        <div class="main-view" id="mainView">
            <div class="empty-state">
                <p>Select a conversation to view details</p>
            </div>
        </div>
    </div>

    <script>
        let allData = {};
        let currentId = null;
        let viewMode = 'chat'; // 'chat' or 'raw'

        async function loadHistory() {
            try {
                const res = await fetch('/api/history');
                const data = await res.json();
                allData = data.conversations || {};
                renderList();
                if (currentId && allData[currentId]) {
                    renderDetail(currentId);
                }
            } catch (e) {
                console.error('Failed to load history:', e);
            }
        }

        function renderList() {
            const container = document.getElementById('convList');
            const sortedIds = Object.keys(allData).sort((a, b) => {
                // Sort by expiry (newer first assumption) or just string desc
                return allData[b].expires_at.localeCompare(allData[a].expires_at);
            });

            container.innerHTML = sortedIds.map(id => {
                const item = allData[id];
                let msgCount = 0;
                if (Array.isArray(item.content)) {
                    msgCount = item.content.length;
                } else if (item.content && item.content.turns && Array.isArray(item.content.turns)) {
                    msgCount = item.content.turns.length;
                }
                
                const date = new Date(item.expires_at).toLocaleString();
                
                return `
                    <div class="conversation-item ${id === currentId ? 'active' : ''}" onclick="selectConversation('${id}')">
                        <div class="conv-id">${id}</div>
                        <div class="conv-meta">
                            <span>${msgCount} msgs</span>
                            <span title="Expires at">${date}</span>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function filterList(text) {
            const items = document.querySelectorAll('.conversation-item');
            text = text.toLowerCase();
            items.forEach(el => {
                const id = el.querySelector('.conv-id').textContent.toLowerCase();
                el.style.display = id.includes(text) ? 'block' : 'none';
            });
        }

        function selectConversation(id) {
            currentId = id;
            renderList(); // Update active state
            renderDetail(id);
        }

        function setViewMode(mode) {
            viewMode = mode;
            if (currentId) renderDetail(currentId);
        }

        function renderDetail(id) {
            const container = document.getElementById('mainView');
            const data = allData[id];
            
            if (!data) return;

            let contentHtml = '';
            let rawContent = data.content;
            let messages = [];
            let metadata = {};

            // Normalize content structure
            if (Array.isArray(rawContent)) {
                messages = rawContent;
            } else if (rawContent && typeof rawContent === 'object') {
                if (Array.isArray(rawContent.turns)) {
                    messages = rawContent.turns;
                }
                // Extract metadata fields
                const { turns, ...meta } = rawContent;
                metadata = meta;
            }

            if (viewMode === 'raw') {
                contentHtml = `<div class="raw-view">${escapeHtml(JSON.stringify(rawContent, null, 2))}</div>`;
            } else {
                // Metadata Header
                let metaHtml = '';
                if (Object.keys(metadata).length > 0) {
                    metaHtml = `<div class="message system" style="margin-bottom: 20px; border-left: 4px solid #00d4ff;">
                        <div class="message-header">Thread Metadata</div>
                        <div class="message-content" style="font-family: monospace; font-size: 12px; border-bottom: 1px solid #333; padding-bottom: 10px; margin-bottom: 10px;">`;
                    
                    for (const [k, v] of Object.entries(metadata)) {
                        metaHtml += `<div style="margin-bottom: 8px;"><span style="color:#00d4ff; font-weight:bold;">${k}:</span> ${formatMetadataValue(k, v)}</div>`;
                    }
                    metaHtml += `</div></div>`;
                }

                if (messages.length > 0) {
                    const msgsHtml = messages.map(msg => {
                        const role = msg.role || 'unknown';
                        let text = msg.content || '';
                        
                        // Handle complex content types if any
                        if (typeof text !== 'string') text = JSON.stringify(text, null, 2);
                        
                        // 1. Escape HTML first
                        text = escapeHtml(text);

                        // 2. Format <SUMMARY> and <thinking> blocks
                        text = text.replace(/&lt;SUMMARY&gt;([\s\S]*?)&lt;\/SUMMARY&gt;/gi, (match, summary) => {
                            return `<div class="summary-block"><div class="summary-header">Summary</div><div class="message-content">${summary.trim()}</div></div>`;
                        });
                        
                        text = text.replace(/&lt;thinking&gt;([\s\S]*?)&lt;\/thinking&gt;/gi, (match, thought) => {
                            let cleanThought = thought.trim();
                            // Strip redundant markdown markers used for terminal view
                            cleanThought = cleanThought.replace(/^>\s*🧠\s*\*\*Thinking:\*\*\s*\n?>\s*/i, "");
                            // Also handle single-line version or variants
                            cleanThought = cleanThought.replace(/^>\s*/gm, ""); // Remove blockquote markers
                            return `<div class="thinking-block"><div class="thinking-header">Thinking Process</div><div class="message-content">${cleanThought.trim()}</div></div>`;
                        });

                        // 2.5 Format Progress Timeline
                        text = text.replace(/### 🔄 Progress Timeline\n([\s\S]*?)(?=\n\n|$)/g, (match, timeline) => {
                            const lines = timeline.trim().split('\n').map(line => {
                                const isExec = line.includes('🛠️');
                                const isSuccess = line.includes('✅');
                                const isError = line.includes('❌');
                                const color = isSuccess ? '#2ed573' : (isError ? '#ff4757' : '#ffa502');
                                return `<div style="color: ${color}; font-size: 12px; margin-bottom: 2px; font-family: monospace;">${line}</div>`;
                            }).join('');
                            return `<div style="margin: 15px 0; padding: 10px; background: rgba(0, 212, 255, 0.05); border: 1px solid rgba(0, 212, 255, 0.2); border-radius: 4px;">
                                <div style="color: #00d4ff; font-weight: bold; font-size: 11px; text-transform: uppercase; margin-bottom: 8px;">🔄 Progress Timeline</div>
                                ${lines}
                            </div>`;
                        });

                        // 3. Format bash code blocks (Terminal-like)
                        text = text.replace(/```bash\s*([\s\S]*?)```/g, (match, code) => {
                            let formatted = code.trim().replace(/ &amp;&amp; /g, ' &&\n    ').replace(/ \|\| /g, ' ||\n    ').replace(/; /g, ';\n    ');
                            return `<div class="terminal-block"><div class="term-header">bash</div><div class="term-body"><span class="term-prompt">$</span>${formatted}</div></div>`;
                        });

                        // 3. Handle generic code blocks
                        text = text.replace(/```(?!bash)(\w*)\s*([\s\S]*?)```/g, (match, lang, code) => {
                            return `<pre class="raw-view" style="margin: 5px 0; background:#0f1525; padding: 10px;">${code.trim()}</pre>`;
                        });
                        
                        const time = msg.timestamp ? `<span style="float:right; color:#666; font-size:10px;">${new Date(msg.timestamp).toLocaleTimeString()}</span>` : '';
                        const model = msg.model_name ? `<span style="color:#a55eea; margin-left:10px; font-size:10px;">${msg.model_name}</span>` : '';

                        return `
                            <div class="message ${role}">
                                <div class="message-header">
                                    ${role} ${model}
                                    ${time}
                                </div>
                                <div class="message-content">${text}</div>
                            </div>
                        `;
                    }).join('');
                    contentHtml = metaHtml + msgsHtml;
                } else {
                    contentHtml = metaHtml + `<div class="message system"><div class="message-content">No messages found or invalid format.</div></div>`;
                }
            }

            container.innerHTML = `
                <div class="view-tabs">
                    <button class="tab-btn ${viewMode === 'chat' ? 'active' : ''}" onclick="setViewMode('chat')">Chat View</button>
                    <button class="tab-btn ${viewMode === 'raw' ? 'active' : ''}" onclick="setViewMode('raw')">Raw JSON</button>
                </div>
                ${contentHtml}
            `;
        }

        function escapeHtml(text) {
            if (text == null) return '';
            return String(text)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        function formatMetadataValue(key, value) {
            if (value == null) return '<span style="color:#666">null</span>';
            
            if (key === 'initial_context' && typeof value === 'object') {
                let html = '<div style="margin-top:5px; padding-left:15px; border-left:1px solid #333;">';
                for (const [subK, subV] of Object.entries(value)) {
                    if (subK === 'prompt') {
                        html += `<div style="margin-bottom:4px;"><span style="color:#888">${subK}:</span> <div style="white-space:pre-wrap; background:#0f1525; padding:8px; border-radius:4px; margin-top:2px; color:#aaa;">${escapeHtml(subV)}</div></div>`;
                    } else if (Array.isArray(subV)) {
                        if (subV.length === 0) {
                            html += `<div><span style="color:#888">${subK}:</span> <span style="color:#666">[]</span></div>`;
                        } else {
                            html += `<div><span style="color:#888">${subK}:</span> <div style="padding-left:10px; color:#aaa;">${subV.map(v => '- ' + escapeHtml(v)).join('<br>')}</div></div>`;
                        }
                    } else {
                        html += `<div><span style="color:#888">${subK}:</span> <span style="color:#eee">${escapeHtml(String(subV))}</span></div>`;
                    }
                }
                html += '</div>';
                return html;
            }

            if (Array.isArray(value)) {
                if (value.length === 0) return '[]';
                return `<div style="padding-left:10px; color:#aaa;">${value.map(v => '- ' + escapeHtml(JSON.stringify(v))).join('<br>')}</div>`;
            }

            if (typeof value === 'object') {
                return `<pre style="margin:5px 0; background:#0f1525; padding:8px; border-radius:4px; font-size:11px; color:#aaa;">${escapeHtml(JSON.stringify(value, null, 2))}</pre>`;
            }

            return `<span style="color:#eee">${escapeHtml(String(value))}</span>`;
        }

        // Load on start
        loadHistory();
    </script>
</body>
</html>
