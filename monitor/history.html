<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PAL MCP History</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: #eee;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .header {
            background: #16213e;
            padding: 15px 20px;
            border-bottom: 1px solid #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }
        h1 {
            font-size: 20px;
            color: #00d4ff;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .nav-link {
            color: #888;
            text-decoration: none;
            font-size: 14px;
            padding: 5px 10px;
            border-radius: 4px;
            transition: all 0.2s;
        }
        .nav-link:hover {
            background: #0f1525;
            color: #eee;
        }
        .container {
            display: flex;
            flex-grow: 1;
            overflow: hidden;
        }
        .sidebar {
            width: 300px;
            background: #16213e;
            border-right: 1px solid #333;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }
        .search-box {
            padding: 15px;
            border-bottom: 1px solid #1a2639;
        }
        .search-box input {
            width: 100%;
            background: #0f1525;
            border: 1px solid #333;
            padding: 8px;
            border-radius: 4px;
            color: #eee;
        }
        .conversation-list {
            flex-grow: 1;
            overflow-y: auto;
            padding: 10px;
        }
        .conversation-item {
            padding: 10px;
            border-radius: 4px;
            cursor: pointer;
            margin-bottom: 5px;
            border: 1px solid transparent;
        }
        .conversation-item:hover {
            background: #1f2a48;
        }
        .conversation-item.active {
            background: #1f2a48;
            border-color: #00d4ff;
        }
        .conv-id {
            font-family: monospace;
            color: #00d4ff;
            font-size: 12px;
            margin-bottom: 4px;
        }
        .conv-meta {
            font-size: 11px;
            color: #888;
            display: flex;
            justify-content: space-between;
        }
        .main-view {
            flex-grow: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .message {
            background: #16213e;
            padding: 15px;
            border-radius: 8px;
            max-width: 90%;
        }
        .message.user {
            align-self: flex-end;
            background: #1f2a48;
            border-bottom-right-radius: 2px;
        }
        .message.assistant {
            align-self: flex-start;
            border-bottom-left-radius: 2px;
        }
        .message-header {
            font-size: 11px;
            color: #888;
            margin-bottom: 8px;
            font-weight: bold;
            text-transform: uppercase;
        }
        .message-content {
            white-space: pre-wrap;
            line-height: 1.5;
            font-size: 14px;
        }
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #666;
        }
        .refresh-btn {
            background: #00d4ff;
            color: #000;
            border: none;
            padding: 5px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        .refresh-btn:hover {
            background: #00b8e6;
        }
        .raw-view {
            font-family: monospace;
            background: #0f1525;
            padding: 15px;
            border-radius: 4px;
            overflow-x: auto;
            white-space: pre;
            color: #a5b1c2;
            font-size: 12px;
        }
        /* Tab for view mode */
        .view-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #333;
        }
        .tab-btn {
            background: transparent;
            border: 1px solid #333;
            color: #888;
            padding: 5px 15px;
            border-radius: 15px;
            cursor: pointer;
            font-size: 12px;
        }
        .tab-btn.active {
            background: #00d4ff22;
            color: #00d4ff;
            border-color: #00d4ff;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>📜 Conversation History</h1>
        <div>
            <button class="refresh-btn" onclick="loadHistory()">Refresh</button>
            <a href="/" class="nav-link" style="margin-left: 10px;">Back to Dashboard</a>
        </div>
    </div>

    <div class="container">
        <div class="sidebar">
            <div class="search-box">
                <input type="text" placeholder="Search ID..." oninput="filterList(this.value)">
            </div>
            <div class="conversation-list" id="convList">
                <!-- Items will be injected here -->
            </div>
        </div>
        <div class="main-view" id="mainView">
            <div class="empty-state">
                <p>Select a conversation to view details</p>
            </div>
        </div>
    </div>

    <script>
        let allData = {};
        let currentId = null;
        let viewMode = 'chat'; // 'chat' or 'raw'

        async function loadHistory() {
            try {
                const res = await fetch('/api/history');
                const data = await res.json();
                allData = data.conversations || {};
                renderList();
                if (currentId && allData[currentId]) {
                    renderDetail(currentId);
                }
            } catch (e) {
                console.error('Failed to load history:', e);
            }
        }

        function renderList() {
            const container = document.getElementById('convList');
            const sortedIds = Object.keys(allData).sort((a, b) => {
                // Sort by expiry (newer first assumption) or just string desc
                return allData[b].expires_at.localeCompare(allData[a].expires_at);
            });

            container.innerHTML = sortedIds.map(id => {
                const item = allData[id];
                const msgCount = Array.isArray(item.content) ? item.content.length : '?';
                const date = new Date(item.expires_at).toLocaleString();
                
                return `
                    <div class="conversation-item ${id === currentId ? 'active' : ''}" onclick="selectConversation('${id}')">
                        <div class="conv-id">${id}</div>
                        <div class="conv-meta">
                            <span>${msgCount} msgs</span>
                            <span title="Expires at">${date}</span>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function filterList(text) {
            const items = document.querySelectorAll('.conversation-item');
            text = text.toLowerCase();
            items.forEach(el => {
                const id = el.querySelector('.conv-id').textContent.toLowerCase();
                el.style.display = id.includes(text) ? 'block' : 'none';
            });
        }

        function selectConversation(id) {
            currentId = id;
            renderList(); // Update active state
            renderDetail(id);
        }

        function setViewMode(mode) {
            viewMode = mode;
            if (currentId) renderDetail(currentId);
        }

        function renderDetail(id) {
            const container = document.getElementById('mainView');
            const data = allData[id];
            
            if (!data) return;

            let contentHtml = '';

            if (viewMode === 'raw') {
                contentHtml = `<div class="raw-view">${escapeHtml(JSON.stringify(data.content, null, 2))}</div>`;
            } else {
                if (Array.isArray(data.content)) {
                    contentHtml = data.content.map(msg => {
                        const role = msg.role || 'unknown';
                        let text = msg.content || '';
                        if (typeof text !== 'string') text = JSON.stringify(text, null, 2);
                        
                        return `
                            <div class="message ${role}">
                                <div class="message-header">${role}</div>
                                <div class="message-content">${escapeHtml(text)}</div>
                            </div>
                        `;
                    }).join('');
                } else {
                    contentHtml = `<div class="message system"><div class="message-content">Invalid content format (not a list)</div></div>`;
                }
            }

            container.innerHTML = `
                <div class="view-tabs">
                    <button class="tab-btn ${viewMode === 'chat' ? 'active' : ''}" onclick="setViewMode('chat')">Chat View</button>
                    <button class="tab-btn ${viewMode === 'raw' ? 'active' : ''}" onclick="setViewMode('raw')">Raw JSON</button>
                </div>
                ${contentHtml}
            `;
        }

        function escapeHtml(text) {
            if (text == null) return '';
            return String(text)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        // Load on start
        loadHistory();
    </script>
</body>
</html>
