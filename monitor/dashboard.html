<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PAL MCP Monitor</title>
    <style>
        :root {
            --bg-color: #1a1a2e;
            --card-bg: #16213e;
            --text-color: #eee;
            --accent-color: #00d4ff;
            --success-color: #2ed573;
            --error-color: #ff4757;
            --warning-color: #ffa502;
            --font-mono: 'Consolas', 'Monaco', 'Courier New', monospace;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            padding: 20px;
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid #333;
        }
        h1 { font-size: 24px; color: var(--accent-color); }
        .status { display: flex; align-items: center; gap: 10px; }
        .status-dot { width: 12px; height: 12px; border-radius: 50%; background: var(--error-color); }
        .status-dot.connected { background: var(--success-color); animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

        /* Stats Grid */
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        .stat-card {
            background: var(--card-bg);
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            border: 1px solid #ffffff11;
        }
        .stat-value { font-size: 24px; font-weight: bold; color: #fff; }
        .stat-label { font-size: 11px; color: #888; text-transform: uppercase; margin-top: 5px; }

        /* Instances */
        .instances { display: grid; gap: 15px; }
        .instance-card {
            background: var(--card-bg);
            border-radius: 10px;
            padding: 20px;
            border: 1px solid #ffffff11;
            display: flex;
            flex-direction: column;
            gap: 15px;
            position: relative;
            transition: all 0.3s ease;
        }
        .instance-card.busy { border-left: 4px solid var(--warning-color); }
        .instance-card.idle { border-left: 4px solid var(--success-color); }
        .instance-card.offline { border-left: 4px solid var(--error-color); opacity: 0.7; }

        .instance-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }
        .instance-id-container { display: flex; align-items: center; gap: 10px; }
        .instance-id { font-family: var(--font-mono); font-weight: bold; font-size: 14px; color: var(--accent-color); }
        .session-tag {
            background: rgba(255, 165, 2, 0.1);
            color: var(--warning-color);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 11px;
            margin-left: 8px;
            border: 1px solid rgba(255, 165, 2, 0.2);
        }

        .instance-meta { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
        .instance-meta-row { display: flex; align-items: center; gap: 10px; justify-content: flex-end; }
        
        .model-tag { background: rgba(165, 94, 226, 0.1); color: #a55eea; padding: 2px 8px; border-radius: 4px; font-size: 11px; border: 1px solid rgba(165, 94, 226, 0.2); }
        .role-tag { background: rgba(32, 191, 107, 0.1); color: #20bf6b; padding: 2px 8px; border-radius: 4px; font-size: 11px; border: 1px solid rgba(32, 191, 107, 0.2); }
        .instance-phase { background: rgba(255, 165, 2, 0.1); color: var(--warning-color); padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; display: flex; align-items: center; gap: 4px; }
        .instance-phase::before { content: "•"; animation: blink 1s infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.2; } }

        .instance-state { padding: 4px 12px; border-radius: 20px; font-size: 11px; font-weight: bold; text-transform: uppercase; }
        .instance-state.idle { background: var(--success-color); color: #000; }
        .instance-state.busy { background: var(--warning-color); color: #000; }
        .instance-state.offline { background: var(--error-color); color: #fff; }

        /* Instance Metrics */
        .instance-metrics {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 10px;
        }
        .metric { background: #0f1525; padding: 10px; border-radius: 6px; text-align: center; border: 1px solid #ffffff05; }
        .metric-value { font-size: 16px; font-weight: bold; }
        .metric-label { font-size: 10px; color: #666; text-transform: uppercase; margin-top: 4px; }

        /* Logs */
        .logs-section { margin-top: 20px; background: #111d35; padding: 15px; border-radius: 10px; }
        .logs-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .header-controls { display: flex; align-items: center; gap: 15px; font-size: 12px; color: #888; }
        
        .logs-container {
            background: #080c18;
            padding: 12px;
            border-radius: 6px;
            font-family: var(--font-mono);
            font-size: 12px;
            height: 450px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 4px;
            user-select: text;
        }

        .log-entry.terminal { display: block; border-bottom: none; }
        .term-line { display: flex; align-items: flex-start; white-space: pre-wrap; word-break: break-all; margin-bottom: 2px; }
        .term-meta { color: #555; margin-right: 10px; font-size: 10px; flex-shrink: 0; padding-top: 2px; }
        
        .term-content { color: #ddd; flex-grow: 1; }
        .term-content.thinking { color: #888; font-style: italic; }
        .term-content.summary { color: #ce9178; font-weight: bold; }
        .term-content.tool-use { color: var(--warning-color); font-weight: bold; }
        .term-content.tool-result { color: var(--success-color); }
        .term-content.error { color: var(--error-color); }
        .term-content.system { color: var(--accent-color); font-style: italic; }

        .term-thinking-block {
            background: rgba(178, 190, 195, 0.08);
            color: #b2bec3;
            padding: 10px 14px;
            border-radius: 6px;
            margin: 6px 0;
            border-left: 3px solid #636e72;
            font-style: italic;
            font-size: 11px;
        }
        .term-summary-block {
            background: rgba(206, 145, 120, 0.08);
            color: #ce9178;
            padding: 12px 16px;
            border-radius: 8px;
            margin: 10px 0;
            border-left: 4px solid #ce9178;
            font-size: 13px;
        }
        .term-code-block {
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 10px 14px;
            border-radius: 6px;
            margin: 8px 0;
            white-space: pre;
            overflow-x: auto;
            border: 1px solid #333;
        }

        .kill-btn, .interrupt-btn {
            background: transparent;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            padding: 2px 8px;
            transition: all 0.2s;
            display: none;
        }
        .kill-btn { background: var(--error-color); color: white; border: none; }
        .interrupt-btn { border: 1px solid var(--warning-color); color: var(--warning-color); }
        .instance-card:hover .kill-btn, .instance-card:hover .interrupt-btn { display: inline-block; }
    </style>
</head>
<body>
    <div class="header">
        <h1>🖥️ PAL MCP Monitor</h1>
        <div style="display: flex; align-items: center; gap: 20px;">
            <a href="/history" style="color: #888; text-decoration: none; font-size: 14px; border: 1px solid #333; padding: 5px 12px; border-radius: 6px;">📜 History</a>
            <div class="status">
                <div class="status-dot" id="statusDot"></div>
                <span id="statusText">Disconnected</span>
            </div>
        </div>
    </div>

    <div class="stats">
        <div class="stat-card"><div class="stat-value" id="totalInstances">0</div><div class="stat-label">Instances</div></div>
        <div class="stat-card"><div class="stat-value" id="busyInstances">0</div><div class="stat-label">Busy</div></div>
        <div class="stat-card"><div class="stat-value" id="totalCalls">0</div><div class="stat-label">Total Calls</div></div>
        <div class="stat-card"><div class="stat-value text-error" id="totalErrors">0</div><div class="stat-label">Errors</div></div>
        <div class="stat-card"><div class="stat-value" id="totalThinking">0s</div><div class="stat-label">🧠 Thinking Time</div></div>
        <div class="stat-card"><div class="stat-value" id="totalExecution">0s</div><div class="stat-label">🛠️ Tool Execution</div></div>
        <div class="stat-card"><div class="stat-value" id="totalInputTokens">0</div><div class="stat-label">Tokens Usage</div></div>
        <div class="stat-card"><div class="stat-value text-accent" id="totalOutputTokens">0</div><div class="stat-label">Total Out Tokens</div></div>
        <div class="stat-card"><div class="stat-value" id="avgExecTime">0ms</div><div class="stat-label">Avg Exec Time</div></div>
        <div class="stat-card"><div class="stat-value" id="errorRate">0%</div><div class="stat-label">Error Rate</div></div>
    </div>

    <div class="instances" id="instances">
        <div style="text-align:center; padding: 40px; color: #666;">📡 Waiting for instances to register...</div>
    </div>

    <div class="logs-section">
        <div class="logs-header">
            <h3>📜 Live Logs</h3>
            <div class="header-controls">
                <label class="toggle-control"><input type="checkbox" id="hideOffline" onchange="toggleHideOffline()"> Hide Offline</label>
                <label class="toggle-control"><input type="checkbox" id="hideIdle" onchange="toggleHideIdle()"> Hide Idle</label>
                <label class="toggle-control"><input type="checkbox" id="terminalView" onchange="toggleTerminalView()"> Terminal View</label>
                <label class="toggle-control"><input type="checkbox" id="autoScroll" onchange="toggleAutoScroll()"> Auto Scroll</label>
                <label class="toggle-control"><input type="checkbox" id="tzLocal" onchange="toggleTz()"> LocalTime</label>
            </div>
        </div>
        <div class="logs-container" id="logsContainer"></div>
    </div>

    <script>
        let ws = null;
        let lastData = null;
        let lastLogEntryRef = null;
        let allLogs = [];
        const MAX_LOGS = 500;
        let useLocalTime = localStorage.getItem('monitor_use_localtime') !== 'false';
        let hideOffline = localStorage.getItem('monitor_hide_offline') === 'true';
        let hideIdle = localStorage.getItem('monitor_hide_idle') === 'true';
        let terminalView = localStorage.getItem('monitor_terminal_view') === 'true';
        let autoScroll = localStorage.getItem('monitor_auto_scroll') !== 'false';

        function initControls() {
            document.getElementById('tzLocal').checked = useLocalTime;
            document.getElementById('hideOffline').checked = hideOffline;
            document.getElementById('hideIdle').checked = hideIdle;
            document.getElementById('terminalView').checked = terminalView;
            document.getElementById('autoScroll').checked = autoScroll;
        }

        function toggleTz() { useLocalTime = document.getElementById('tzLocal').checked; localStorage.setItem('monitor_use_localtime', useLocalTime); reRenderLogs(); }
        function toggleHideOffline() { hideOffline = document.getElementById('hideOffline').checked; localStorage.setItem('monitor_hide_offline', hideOffline); updateUI(lastData); }
        function toggleHideIdle() { hideIdle = document.getElementById('hideIdle').checked; localStorage.setItem('monitor_hide_idle', hideIdle); updateUI(lastData); }
        function toggleTerminalView() { terminalView = document.getElementById('terminalView').checked; localStorage.setItem('monitor_terminal_view', terminalView); reRenderLogs(); }
        function toggleAutoScroll() { autoScroll = document.getElementById('autoScroll').checked; localStorage.setItem('monitor_auto_scroll', autoScroll); }

        function formatNumber(n) { return n >= 1000 ? (n/1000).toFixed(1) + 'k' : n; }
        function formatUptime(s) { 
            if (s < 60) return Math.round(s) + 's';
            if (s < 3600) return Math.floor(s/60) + 'm ' + Math.round(s%60) + 's';
            return Math.floor(s/3600) + 'h ' + Math.floor((s%3600)/60) + 'm';
        }
        function formatDuration(ms) {
            if (ms < 1000) return Math.round(ms) + 'ms';
            return (ms / 1000).toFixed(1) + 's';
        }
        function escapeHtml(t) { if(!t) return ''; return String(t).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }

        function formatTerminalText(text) {
            if (!text) return '';
            let escaped = escapeHtml(text);
            
            const thinkingRegex = /&lt;thinking&gt;([\s\S]*?)&lt;\/thinking&gt;/gi;
            escaped = escaped.replace(thinkingRegex, (m, p1) => {
                let clean = p1.replace(/^&gt;\s*🧠\s*\*\*Thinking:\*\*\s*\n?&gt;\s*/i, "").replace(/^&gt;\s*/gm, "").trim();
                return `<div class="term-thinking-block">${clean}</div>`;
            });

            const summaryRegex = /&lt;SUMMARY&gt;([\s\S]*?)&lt;\/SUMMARY&gt;/gi;
            escaped = escaped.replace(summaryRegex, (m, p1) => {
                return `<div class="term-summary-block"><div style="font-size:10px;font-weight:bold;text-transform:uppercase;margin-bottom:6px;opacity:0.8;">📋 Summary</div>${p1.trim()}</div>`;
            });

            const timelineRegex = /### 🔄 Progress Timeline\n([\s\S]*?)(?=\n\n|$)/g;
            escaped = escaped.replace(timelineRegex, (m, p1) => {
                const lines = p1.trim().split('\n').map(l => {
                    const color = l.includes('✅') ? '#2ed573' : (l.includes('❌') ? '#ff4757' : '#ffa502');
                    return `<div style="color:${color};font-size:11px;font-family:monospace;margin-bottom:2px;">${l}</div>`;
                }).join('');
                return `<div style="margin:12px 0;padding:12px;background:rgba(0,212,255,0.05);border:1px solid rgba(0,212,255,0.2);border-radius:6px;"><div style="color:#00d4ff;font-weight:bold;font-size:10px;text-transform:uppercase;margin-bottom:8px;">🔄 Progress Timeline</div>${lines}</div>`;
            });

            const codeRegex = /```[a-z]*\n?([\s\S]*?)\n?```/g;
            return escaped.replace(codeRegex, (m, p1) => `<div class="term-code-block">${p1.trim()}</div>`);
        }

        function getShortId(sessionId, instanceId) {
            let rawId = sessionId;
            if (!rawId || rawId === 'standalone') rawId = (instanceId ? instanceId.split('@')[0] : 'system');
            let cleanId = String(rawId);
            if (cleanId.toLowerCase().startsWith('thread:')) cleanId = cleanId.substr(7);
            return cleanId.substr(0, 8);
        }

        function updateUI(data) {
            if (!data) return;
            lastData = data;
            const allInstances = data.instances || [];
            
            // Helper to get value with snake_case and camelCase support
            const get = (obj, key) => {
                if (!obj) return 0;
                const camelKey = key.replace(/_([a-z])/g, (g) => g[1].toUpperCase());
                return obj[key] || obj[camelKey] || 0;
            };

            // Global Stats
            document.getElementById('totalInstances').textContent = allInstances.length;
            document.getElementById('busyInstances').textContent = allInstances.filter(i => i.state === 'busy').length;
            
            document.getElementById('totalCalls').textContent = get(data, 'total_calls');
            document.getElementById('totalErrors').textContent = get(data, 'total_errors');
            
            document.getElementById('totalInputTokens').textContent = formatNumber(get(data, 'total_input_tokens'));
            document.getElementById('totalOutputTokens').textContent = formatNumber(get(data, 'total_output_tokens'));
            
            document.getElementById('totalThinking').textContent = formatDuration(get(data, 'total_thinking_ms'));
            document.getElementById('totalExecution').textContent = formatDuration(get(data, 'total_execution_ms'));
            
            const withMetrics = allInstances.filter(i => (get(i, 'total_calls')) > 0);
            document.getElementById('avgExecTime').textContent = withMetrics.length ? formatDuration(withMetrics.reduce((sum, i) => sum + (get(i, 'avg_execution_time_1m')), 0) / withMetrics.length) : '0ms';
            document.getElementById('errorRate').textContent = withMetrics.length ? (withMetrics.reduce((sum, i) => sum + (get(i, 'error_rate_1m')), 0) / withMetrics.length * 100).toFixed(1) + '%' : '0%';

            let instances = allInstances;
            if (hideOffline) instances = instances.filter(i => i.state !== 'offline');
            if (hideIdle) instances = instances.filter(i => i.state !== 'idle');

            const container = document.getElementById('instances');
            if (instances.length === 0) {
                container.innerHTML = '<div style="text-align:center; padding: 40px; color: #666;">📡 No instances to show</div>';
                return;
            }

            container.innerHTML = instances.map(inst => {
                const shortId = getShortId(inst.session_id, inst.instance_id);
                return `
                    <div class="instance-card ${inst.state}">
                        <div class="instance-header">
                            <div class="instance-id-container">
                                <span class="instance-id">${inst.instance_id}</span> 
                                ${inst.session_id ? `<span class="session-tag" title="Session: ${inst.session_id}">[${shortId}]</span>` : ''}
                            </div>
                            <div class="instance-meta">
                                <div class="instance-meta-row">
                                    ${inst.model_name ? `<span class="model-tag">${inst.model_name}</span>` : ''}
                                    ${inst.active_role ? `<span class="role-tag">${inst.active_role}</span>` : ''}
                                    ${inst.last_status && inst.state === 'busy' ? `<span class="instance-phase">${inst.last_status}</span>` : ''}
                                    ${inst.state === 'busy' ? `
                                        <span style="color:#b2bec3;font-size:11px;margin-left:12px;font-weight:bold;">🧠 ${formatDuration(get(inst, 'thinking_ms'))}</span>
                                        <span style="color:#2ed573;font-size:11px;margin-left:12px;font-weight:bold;">🛠️ ${formatDuration(get(inst, 'execution_ms'))}</span>
                                    ` : ''}
                                    <span class="instance-state ${inst.state}">${inst.state}</span>
                                    ${inst.state === 'busy' ? `<button class="interrupt-btn" onclick="interruptInstance('${inst.instance_id}')" title="Interrupt">✋</button>` : ''}
                                    ${inst.state !== 'offline' ? `<button class="kill-btn" onclick="killInstance('${inst.instance_id}')" title="Kill">💀</button>` : ''}
                                </div>
                            </div>
                        </div>
                        <div class="instance-metrics">
                            <div class="metric"><div class="metric-value">${formatUptime(get(inst, 'uptime_seconds'))}</div><div class="metric-label">Uptime</div></div>
                            <div class="metric"><div class="metric-value" style="color:#b2bec3;">🧠 ${formatDuration(get(inst, 'thinking_ms'))}</div><div class="metric-label">Thinking</div></div>
                            <div class="metric"><div class="metric-value" style="color:#2ed573;">🛠️ ${formatDuration(get(inst, 'execution_ms'))}</div><div class="metric-label">Execution</div></div>
                            <div class="metric"><div class="metric-value">${formatNumber(get(inst, 'input_tokens'))}</div><div class="metric-label">In Tokens</div></div>
                            <div class="metric"><div class="metric-value text-accent">${formatNumber(get(inst, 'output_tokens'))}</div><div class="metric-label">Out Tokens</div></div>
                            <div class="metric"><div class="metric-value">${get(inst, 'total_calls')}</div><div class="metric-label">Calls</div></div>
                            <div class="metric"><div class="metric-value">${formatDuration(Math.round(get(inst, 'avg_execution_time_1m')))}</div><div class="metric-label">Avg Time</div></div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function appendLog(event, buffer = true) {
            if (buffer) { allLogs.push(event); if (allLogs.length > MAX_LOGS) allLogs.shift(); }
            const container = document.getElementById('logsContainer');
            
            const timeStr = new Date(event.timestamp).toLocaleTimeString(undefined, { hour12: false });
            const session = getShortId(event.session_id, event.instance_id);
            const tool = event.tool_name || 'system';
            const parsed = parseLogContent(event.log_data);
            if (!parsed) return;

            if (terminalView) {
                const canMerge = lastLogEntryRef && lastLogEntryRef.id === session && lastLogEntryRef.type === parsed.type && parsed.isDelta;
                if (canMerge) {
                    const contentEl = lastLogEntryRef.element.querySelector('.term-content');
                    lastLogEntryRef.rawText += parsed.text;
                    contentEl.innerHTML = formatTerminalText(lastLogEntryRef.rawText);
                } else {
                    const entry = document.createElement('div');
                    entry.className = 'log-entry terminal';
                    entry.innerHTML = `<div class="term-line"><span class="term-meta">[${timeStr}] [${session}] [${tool}]</span><div class="term-content ${parsed.type}">${formatTerminalText(parsed.text)}</div></div>`;
                    container.appendChild(entry);
                    lastLogEntryRef = { id: session, type: parsed.type, element: entry, rawText: parsed.text };
                }
            } else {
                const entry = document.createElement('div');
                entry.className = 'log-entry';
                entry.innerHTML = `<div class="term-line"><span class="term-meta">[${timeStr}] [${session}]</span><span class="term-content ${parsed.type}">${escapeHtml(parsed.text)}</span></div>`;
                container.appendChild(entry);
                lastLogEntryRef = null;
            }
            if (autoScroll) container.scrollTop = container.scrollHeight;
        }

        function reRenderLogs() {
            document.getElementById('logsContainer').innerHTML = '';
            lastLogEntryRef = null;
            allLogs.forEach(l => appendLog(l, false));
        }

        function parseLogContent(raw) {
            if (!raw) return null;
            try {
                if (raw.trim().startsWith('{')) {
                    const data = JSON.parse(raw);
                    if (['message_start', 'message_delta', 'message_stop', 'content_block_start', 'content_block_stop', 'ping'].includes(data.type)) return null;
                    
                    if (data.type === 'message' || data.type === 'assistant') {
                        let content = data.content || data.thought;
                        if (data.message && data.message.content) content = data.message.content;
                        if (Array.isArray(content)) {
                            const toolUse = content.find(c => c.type === 'tool_use');
                            if (toolUse) return { type: 'tool-use', text: `> Executing ${toolUse.name}${toolUse.input ? ': ' + JSON.stringify(toolUse.input) : ''}`, isDelta: false };
                            const thinking = content.find(c => c.type === 'thinking');
                            if (thinking) return { type: 'thinking', text: thinking.thinking || thinking.text || '', isDelta: false };
                            content = content.filter(c => c.type === 'text' || typeof c === 'string').map(c => c.text || c).join('');
                        }
                        if (!content && data.thinking) content = data.thinking;
                        if (content) return { type: 'thinking', text: content, isDelta: data.delta === true || data.type === 'message' };
                    }
                    
                    if (data.type === 'stream_event') {
                        const evt = data.event;
                        if (!evt) return null;
                        
                        if (evt.type === 'content_block_delta' && evt.delta) {
                            const text = evt.delta.text || evt.delta.thinking;
                            if (text) return { type: 'thinking', text: text, isDelta: true };
                        }
                        // Ignore other stream events (message_start, message_stop, etc.) to prevent raw JSON dump
                        return null;
                    }
                    
                    if (data.type === 'content_block_delta' && data.delta) {
                        const text = data.delta.text || data.delta.thinking;
                        if (text) return { type: 'thinking', text: text, isDelta: true };
                    }
                    
                    if (data.type === 'system') return null;

                    if (data.type === 'tool_use') return { type: 'tool-use', text: `> Executing ${data.name || data.tool_name}...`, isDelta: false };
                    if (data.type === 'tool_result') {
                        const isError = data.status === 'error' || data.is_error;
                        let text = data.content || data.output || '';
                        if (Array.isArray(text)) text = text.join(' ');
                        return { type: isError ? 'error' : 'tool-result', text: `< ${text}`, isDelta: false };
                    }
                    
                    if (data.type === 'error' || data.type === 'turn.failed') {
                        const err = (data.type === 'turn.failed') ? (data.error || {}) : data;
                        return { type: 'error', text: `! Error: ${err.message || 'unknown error'}`, isDelta: false };
                    }
                    if (data.type === 'result') {
                        const isError = data.status === 'error' || data.is_error;
                        return { type: isError ? 'error' : 'system', text: isError ? '! Failed' : '> Finished', isDelta: false };
                    }
                }
            } catch (e) {}
            
            const lower = raw.toLowerCase();
            if (lower.includes('error') || lower.includes('fail') || lower.includes('exception')) return { type: 'error', text: raw, isDelta: false };
            if (raw.startsWith('> ') || raw.startsWith('! ') || raw.includes('📋 Summary:')) return { type: 'system', text: raw, isDelta: false };
            
            return { type: 'raw', text: raw, isDelta: false };
        }

        function connect() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            ws = new WebSocket(`${protocol}//${window.location.host}/ws`);
            ws.onopen = () => { document.getElementById('statusDot').classList.add('connected'); document.getElementById('statusText').textContent = 'Connected'; };
            ws.onclose = () => { document.getElementById('statusDot').classList.remove('connected'); document.getElementById('statusText').textContent = 'Disconnected'; setTimeout(connect, 3000); };
            ws.onmessage = (e) => { const d = JSON.parse(e.data); if (d.type === 'state_update') updateUI(d); else if (d.event_type === 'tool_log') appendLog(d); };
        }

        async function interruptInstance(id) { await fetch(`/api/instances/${id}/interrupt`, { method: 'POST' }); }
        async function killInstance(id) { if (confirm('Kill instance?')) await fetch(`/api/instances/${id}/kill`, { method: 'POST' }); }

        window.onload = () => { initControls(); connect(); };
    </script>
</body>
</html>
