<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PAL MCP Monitor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: #eee;
            min-height: 100vh;
            padding: 20px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid #333;
        }
        h1 {
            font-size: 24px;
            color: #00d4ff;
        }
        .status {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #ff4757;
        }
        .status-dot.connected {
            background: #2ed573;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        .stat-card {
            background: #16213e;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
        }
        .stat-value {
            font-size: 36px;
            font-weight: bold;
            color: #00d4ff;
        }
        .stat-label {
            color: #888;
            margin-top: 5px;
        }
        .instances {
            display: grid;
            gap: 15px;
        }
        .instance-card {
            background: #16213e;
            border-radius: 10px;
            padding: 20px;
            border-left: 4px solid #00d4ff;
            display: flex;
            flex-direction: column;
        }
        .instance-card.busy {
            border-left-color: #ffa502;
        }
        .instance-card.offline {
            border-left-color: #ff4757;
            opacity: 0.6;
        }
        .instance-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .instance-id {
            font-family: monospace;
            font-size: 14px;
            color: #00d4ff;
        }
        .active-tool-tag {
            background: #00d4ff22;
            color: #00d4ff;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: bold;
            text-transform: uppercase;
            margin-left: 10px;
            border: 1px solid #00d4ff44;
        }
        .model-tag {
            background: #a55eea22;
            color: #a55eea;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: bold;
            margin-left: 8px;
            border: 1px solid #a55eea44;
        }
        .instance-phase {
            background: #ffa50222;
            color: #ffa502;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: bold;
            margin-left: 8px;
            margin-right: auto;
            border: 1px solid #ffa50244;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .instance-phase::before {
            content: "•";
            animation: blink 1s infinite;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.2; }
        }
        .instance-state {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
            flex-shrink: 0;
        }
        .instance-state.idle {
            background: #2ed573;
            color: #000;
        }
        .instance-state.busy {
            background: #ffa502;
            color: #000;
        }
        .instance-state.offline {
            background: #ff4757;
            color: #fff;
        }
        .instance-metrics {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 10px;
            margin-bottom: 15px;
        }
        .metric {
            background: #1a1a2e;
            padding: 10px;
            border-radius: 5px;
            text-align: center;
        }
        .metric-value {
            font-size: 18px;
            font-weight: bold;
        }
        .metric-label {
            font-size: 11px;
            color: #888;
        }
        .active-tool {
            background: #ffa502;
            color: #000;
            padding: 8px 15px;
            border-radius: 5px;
            display: inline-block;
            margin-bottom: 15px;
        }
        .recent-calls {
            margin-top: 15px;
        }
        .recent-calls h4 {
            color: #888;
            font-size: 12px;
            margin-bottom: 10px;
        }
        .call-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .call-item {
            background: #1a1a2e;
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 12px;
            font-family: monospace;
        }
        .call-item.success {
            border-left: 3px solid #2ed573;
        }
        .call-item.error {
            border-left: 3px solid #ff4757;
        }
        .call-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
        }
        .call-name {
            font-weight: bold;
        }
        .call-detail {
            font-size: 10px;
            color: #aaa;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            padding-top: 2px;
        }
        .call-detail.input {
            color: #00d4ff;
        }
        .call-detail.output {
            color: #2ed573;
        }
        .logs-section {
            margin-top: 20px;
            background: #16213e;
            padding: 15px;
            border-radius: 10px;
        }
        .logs-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .logs-header h3 {
            font-size: 16px;
            color: #888;
            margin: 0;
        }
        .tz-toggle {
            font-size: 12px;
            color: #888;
        }
        .tz-toggle label {
            display: flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
        }
        .logs-container {
            background: #0f1525;
            padding: 10px;
            border-radius: 5px;
            font-family: monospace;
            font-size: 12px;
            height: 300px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .log-entry {
            display: flex;
            gap: 10px;
            border-bottom: 1px solid #1a2639;
            padding-bottom: 2px;
            line-height: 1.4;
        }
        .log-time {
            color: #666;
            min-width: 70px;
            flex-shrink: 0;
        }
        .log-session {
            color: #ffa502;
            font-family: monospace;
            min-width: 80px;
            flex-shrink: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .log-tool {
            color: #00d4ff;
            font-weight: bold;
            min-width: 70px;
            flex-shrink: 0;
        }
        .log-msg {
            color: #ddd;
            white-space: pre-wrap;
            word-break: break-all;
        }
        .log-msg.error {
            color: #ff4757;
        }
        .no-instances {
            text-align: center;
            padding: 60px 20px;
            color: #666;
        }
        .no-instances .icon {
            font-size: 48px;
            margin-bottom: 15px;
        }
        .no-instances {
            text-align: center;
            padding: 60px 20px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🖥️ PAL MCP Monitor</h1>
        <div class="status">
            <div class="status-dot" id="statusDot"></div>
            <span id="statusText">Disconnected</span>
        </div>
    </div>

    <div class="stats">
        <div class="stat-card">
            <div class="stat-value" id="totalInstances">0</div>
            <div class="stat-label">Instances</div>
        </div>
        <div class="stat-card">
            <div class="stat-value" id="busyInstances">0</div>
            <div class="stat-label">Busy</div>
        </div>
        <div class="stat-card">
            <div class="stat-value" id="totalCalls">0</div>
            <div class="stat-label">Total Calls</div>
        </div>
        <div class="stat-card">
            <div class="stat-value" id="totalErrors">0</div>
            <div class="stat-label">Total Errors</div>
        </div>
        <div class="stat-card">
            <div class="stat-value" id="avgExecTime">0ms</div>
            <div class="stat-label">Avg Exec Time (1h)</div>
        </div>
        <div class="stat-card">
            <div class="stat-value" id="errorRate">0%</div>
            <div class="stat-label">Error Rate (1h)</div>
        </div>
    </div>

    <div class="instances" id="instances">
        <div class="no-instances">
            <div class="icon">📡</div>
            <p>No MCP instances connected</p>
            <p style="margin-top: 10px; font-size: 14px;">Waiting for instances to register...</p>
        </div>
    </div>

    <div class="logs-section">
        <div class="logs-header">
            <h3>📜 Live Logs</h3>
            <div class="tz-toggle">
                <label>
                    <input type="checkbox" id="tzLocal" onchange="toggleTz()"> LocalTime (UTC if off)
                </label>
            </div>
        </div>
        <div class="logs-container" id="logsContainer"></div>
    </div>

    <script>
        let ws = null;
        // Load preference, default to true (LocalTime) if not set
        let useLocalTime = localStorage.getItem('monitor_use_localtime') !== 'false';

        function initTz() {
            const cb = document.getElementById('tzLocal');
            if (cb) {
                cb.checked = useLocalTime;
            }
        }

        function toggleTz() {
            useLocalTime = document.getElementById('tzLocal').checked;
            localStorage.setItem('monitor_use_localtime', useLocalTime);
            
            refreshLogTimes();
        }

        function refreshLogTimes() {
            const entries = document.querySelectorAll('.log-entry');
            entries.forEach(entry => {
                const timestamp = entry.getAttribute('data-timestamp');
                if (timestamp) {
                    entry.querySelector('.log-time').textContent = `[${formatLogTime(timestamp)}]`;
                }
            });
        }

        function formatLogTime(isoString) {
            const date = new Date(isoString);
            if (useLocalTime) {
                // Local Time (Browser default)
                return date.toLocaleTimeString(undefined, { 
                    hour12: false,
                    hour: '2-digit',
                    minute: '2-digit',
                    second: '2-digit'
                });
            } else {
                // UTC
                return date.toLocaleTimeString('en-GB', { 
                    timeZone: 'UTC',
                    hour12: false,
                    hour: '2-digit',
                    minute: '2-digit',
                    second: '2-digit'
                });
            }
        }

        function connect() {
            // Automatically determine WebSocket URL based on current page location
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const host = window.location.host;
            const url = `${protocol}//${host}/ws`;

            if (ws) {
                console.log("Closing existing WebSocket connection...");
                ws.close();
            }

            console.log(`Attempting to connect to Monitor WebSocket: ${url}`);
            ws = new WebSocket(url);

            ws.onopen = () => {
                console.log("WebSocket connection established successfully.");
                document.getElementById('statusDot').classList.add('connected');
                document.getElementById('statusText').textContent = 'Connected';
            };

            ws.onclose = (event) => {
                console.log(`WebSocket connection closed. Code: ${event.code}, Reason: ${event.reason}`);
                document.getElementById('statusDot').classList.remove('connected');
                document.getElementById('statusText').textContent = 'Disconnected';
                // Auto-reconnect after 3 seconds
                setTimeout(() => {
                    if (!ws || ws.readyState === WebSocket.CLOSED) {
                        console.log("Attempting automatic reconnection...");
                        connect();
                    }
                }, 3000);
            };

            ws.onerror = (error) => {
                console.error('WebSocket connection error:', error);
            };

            ws.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    if (data.type === 'state_update') {
                        updateUI(data);
                    } else if (data.event_type === 'tool_log') {
                        appendLog(data);
                    } else if (data.type === 'ping') {
                        ws.send('pong');
                    }
                } catch (e) {
                    console.error('Parse error:', e);
                }
            };
        }

        function appendLog(event) {
            const container = document.getElementById('logsContainer');
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            // Store raw timestamp for timezone switching
            entry.setAttribute('data-timestamp', event.timestamp);
            
            const time = formatLogTime(event.timestamp);
            const tool = event.tool_name || 'system';
            
            // Session ID logic: priority: session_id > instance_id
            let session = '-';
            if (event.session_id) {
                session = event.session_id.substr(0, 8);
            } else if (event.instance_id) {
                // Use part of PID if session is missing
                session = event.instance_id.split('@')[0];
            }
            
            const msg = event.log_data || '';
            
            // Check for error keywords to highlight, but exclude "is_error":false patterns common in JSON
            const isError = /error|fail|exception/i.test(msg) && !/"is_error"\s*:\s*false/i.test(msg);
            
            entry.innerHTML = `
                <span class="log-time">[${time}]</span>
                <span class="log-session" title="${event.session_id || ''}">[${session}]</span>
                <span class="log-tool">[${tool}]</span>
                <span class="log-msg ${isError ? 'error' : ''}">${escapeHtml(msg)}</span>
            `;
            
            container.appendChild(entry);
            
            // Auto-scroll
            container.scrollTop = container.scrollHeight;
            
            // Limit log entries
            while (container.children.length > 500) {
                container.removeChild(container.firstChild);
            }
        }

        function updateUI(data) {
            const instances = data.instances || [];

            // Update stats
            document.getElementById('totalInstances').textContent = instances.length;
            document.getElementById('busyInstances').textContent =
                instances.filter(i => i.state === 'busy').length;

            const totalCalls = instances.reduce((sum, i) => sum + (i.total_calls || 0), 0);
            document.getElementById('totalCalls').textContent = totalCalls;

            const totalErrors = instances.reduce((sum, i) => sum + (i.total_errors || 0), 0);
            document.getElementById('totalErrors').textContent = totalErrors;

            // Only count instances that have actually made calls in the window for averaging
            const instancesWithMetrics = instances.filter(i => (i.recent_calls && i.recent_calls.length > 0) || i.total_calls > 0);
            
            const avgTime = instancesWithMetrics.length > 0
                ? Math.round(instancesWithMetrics.reduce((sum, i) => sum + (i.avg_execution_time_1m || 0), 0) / instancesWithMetrics.length)
                : 0;
            document.getElementById('avgExecTime').textContent = avgTime + 'ms';

            const avgError = instancesWithMetrics.length > 0
                ? (instancesWithMetrics.reduce((sum, i) => sum + (i.error_rate_1m || 0), 0) / instancesWithMetrics.length * 100).toFixed(1)
                : 0;
            document.getElementById('errorRate').textContent = avgError + '%';

            // Update instances
            const container = document.getElementById('instances');

            if (instances.length === 0) {
                container.innerHTML = `
                    <div class="no-instances">
                        <div class="icon">📡</div>
                        <p>No MCP instances connected</p>
                        <p style="margin-top: 10px; font-size: 14px;">Waiting for instances to register...</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = instances.map(inst => {
                const uptime = formatUptime(inst.uptime_seconds);
                const recentCalls = (inst.recent_calls || []).slice(0, 5);

                return `
                    <div class="instance-card ${inst.state}">
                        <div class="instance-header">
                            <span class="instance-id" title="${inst.instance_id}">${inst.instance_id}</span>
                            ${inst.active_tool ? `<span class="active-tool-tag">${inst.active_tool}</span>` : ''}
                            ${inst.model_name ? `<span class="model-tag">${inst.model_name}</span>` : ''}
                            ${inst.last_status && inst.state === 'busy' ? `<span class="instance-phase">${inst.last_status}</span>` : ''}
                            <span class="instance-state ${inst.state}">${inst.state}</span>
                        </div>

                        <div class="instance-metrics">
                            <div class="metric">
                                <div class="metric-value">${uptime}</div>
                                <div class="metric-label">Uptime</div>
                            </div>
                            <div class="metric">
                                <div class="metric-value">${inst.total_calls}</div>
                                <div class="metric-label">Total Calls</div>
                            </div>
                            <div class="metric">
                                <div class="metric-value">${inst.total_errors}</div>
                                <div class="metric-label">Errors (Life)</div>
                            </div>
                            <div class="metric">
                                <div class="metric-value">${Math.round(inst.avg_execution_time_1m || 0)}ms</div>
                                <div class="metric-label">Avg Time (1h)</div>
                            </div>
                            <div class="metric">
                                <div class="metric-value">${((inst.error_rate_1m || 0) * 100).toFixed(1)}%</div>
                                <div class="metric-label">Err Rate (1h)</div>
                            </div>
                        </div>

                        ${recentCalls.length > 0 ? `
                            <div class="recent-calls">
                                <h4>Recent Tool Calls</h4>
                                <div class="call-list">
                                    ${recentCalls.map(call => `
                                        <div class="call-item ${call.status}">
                                            <div class="call-header">
                                                <span class="call-name">${call.tool}</span>
                                                <span class="call-duration">${call.duration_ms}ms</span>
                                            </div>
                                            ${call.tool_input ? `<div class="call-detail input" title="${escapeHtml(call.tool_input)}">Input: ${truncate(call.tool_input)}</div>` : ''}
                                            ${call.tool_output ? `<div class="call-detail output" title="${escapeHtml(call.tool_output)}">Output: ${truncate(call.tool_output)}</div>` : ''}
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                        ` : ''}
                    </div>
                `;
            }).join('');
        }

        function truncate(str, n=50) {
            if (!str) return '';
            const s = String(str);
            return (s.length > n) ? s.substr(0, n-1) + '...' : s;
        }

        function escapeHtml(text) {
            if (text == null) return '';
            return String(text)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        function formatUptime(seconds) {
            if (seconds < 60) return Math.round(seconds) + 's';
            if (seconds < 3600) return Math.round(seconds / 60) + 'm';
            if (seconds < 86400) return Math.round(seconds / 3600) + 'h';
            return Math.round(seconds / 86400) + 'd';
        }

        // Auto-connect on load
        window.onload = () => {
            initTz();
            connect();
        };
    </script>
</body>
</html>
